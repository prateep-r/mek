# GoReleaser config — https://goreleaser.com
# Test locally:  goreleaser check && goreleaser release --snapshot --clean
version: 2

project_name: mek

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: mek
    main: ./cmd/mek
    binary: mek
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/prateep-r/mek/internal/version.Version={{ .Tag }}
      - -X github.com/prateep-r/mek/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/prateep-r/mek/internal/version.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    # No version in the name, so install.sh / self-update can use
    # https://github.com/<repo>/releases/latest/download/mek_<os>_<arch>.tar.gz
    name_template: "mek_{{ .Os }}_{{ .Arch }}"
    files: [README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

# brew install prateep-r/tap/mek   (macOS)
homebrew_casks:
  - name: mek
    repository:
      owner: prateep-r
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/prateep-r/mek
    description: Log in, switch and run commands across AWS, GCP and other clouds
    skip_upload: auto # don't publish pre-releases (v0.2.0-rc1) to the tap
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/mek"]
          end
