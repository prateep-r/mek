# mek's own Docker environment: Floci emulators for AWS, GCP and Azure, plus
# the test image with the real cloud CLIs. Isolated from other projects: its
# own compose project name, network and volumes, and host ports that are not
# the emulators' defaults (14566/14588/14577, bound to 127.0.0.1 only).
#
#   make docker-test    # run every test layer in the container
#   make docker-up      # start only the emulators (for local runs/debugging)
#   make docker-down    # stop and remove everything this file created
name: mek-test

x-labels: &labels
  io.github.prateep-r.mek: "test"

services:
  floci-aws:
    image: floci/floci:2.1.0
    labels: *labels
    environment:
      # SSO device logins authenticate as this principal (test/emulator/sso_test.go).
      FLOCI_SERVICES_SSOOIDC_LOCAL_PRINCIPAL_ID: 11111111-2222-3333-4444-555555555555
    ports: ["127.0.0.1:14566:4566"]
    networks: [mek-test]

  floci-gcp:
    image: floci/floci-gcp:0.9.0
    labels: *labels
    ports: ["127.0.0.1:14588:4588"]
    networks: [mek-test]

  floci-az:
    image: floci/floci-az:0.13.0
    labels: *labels
    ports: ["127.0.0.1:14577:4577"]
    networks: [mek-test]

  tests:
    build:
      context: ..            # test/: the Dockerfile only needs these files
      dockerfile: docker/Dockerfile
    image: mek-test:local
    labels: *labels
    profiles: [tests]       # not started by `docker compose up`
    depends_on: [floci-aws, floci-gcp, floci-az]
    networks: [mek-test]
    volumes:
      - ../..:/src:ro       # the repository, read-only
      - gomod:/home/mek/go  # module and build cache between runs
    environment:
      # A missing CLI or emulator is a failure here, never a skip.
      MEK_CONTRACT_REQUIRE: "1"
      MEK_EMULATOR_REQUIRE: "1"
      # Safe in a throwaway container: KooCLI writes the user's ~/.hcloud.
      MEK_CONTRACT_HCLOUD: "1"
      MEK_FLOCI_AWS_URL: http://floci-aws:4566
      MEK_FLOCI_GCP_URL: http://floci-gcp:4588
      MEK_FLOCI_AZ_URL: http://floci-az:4577

networks:
  mek-test:
    labels: *labels

volumes:
  gomod:
    labels: *labels
