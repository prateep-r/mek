# mek configuration — https://github.com/prateep-r/mek
#
# Each context is one cloud target. Switch with `mek use <name>`.
# Do NOT commit real account IDs / SSO URLs to a public repository.

contexts:
  # AWS via IAM Identity Center (SSO).
  # Contexts sharing the same sso_start_url share one login.
  example-uat:
    provider: aws
    sso_start_url: https://your-org.awsapps.com/start
    sso_region: ap-southeast-1      # region of IAM Identity Center
    account_id: "111122223333"
    role: ReadOnlyAccess
    region: ap-southeast-1          # default region for commands
    # clusters:                     # Kubernetes clusters for `mek kube` / `mek kubectl`
    #   main: {name: uat-eks}       # EKS cluster name; region defaults to the context's
    #   data: {name: data-eks, region: us-east-1, namespace: etl}
    # targets:                      # hosts for `mek shell`
    #   bastion: {instance: "tag:Name=bastion"}   # or an instance id: i-0abc1234def567890
    # tunnels:                      # port forwards for `mek tunnel`
    #   db: {via: bastion, host: mydb.cluster-xyz.ap-southeast-1.rds.amazonaws.com, port: 5432}   # → localhost:15432

  # Production: write operations ask for confirmation,
  # destructive ones (delete/terminate/...) require typing the context name.
  example-prod:
    provider: aws
    sso_start_url: https://your-org.awsapps.com/start
    sso_region: ap-southeast-1
    account_id: "444455556666"
    role: ReadOnlyAccess
    region: ap-southeast-1
    protected: true
    readonly: true                  # block write/destructive commands entirely

  # AWS using a profile you already have in ~/.aws/config.
  # example-legacy:
  #   provider: aws
  #   aws_profile: my-existing-profile

  # GCP project. Each context gets its own isolated gcloud config dir.
  # example-gcp:
  #   provider: gcp
  #   project: my-project-id
  #   region: asia-southeast1
  #   account: you@example.com      # optional
  #   use_metadata: true            # optional, on a GCP VM: gcloud may use the VM's service account
  #   clusters:
  #     apps: {name: apps-cluster, location: asia-southeast1}   # GKE: zone or region
  #     core: {name: core-cluster, location: asia-southeast1, endpoint: private}   # or dns
  #   targets:
  #     web: {instance: web-1, zone: asia-southeast1-b}          # zone is looked up if omitted
  #   tunnels:
  #     sql: {cloudsql: "my-project-id:asia-southeast1:db", local_port: 15432}   # needs `mek login --adc`

  # Azure subscription. Each context gets its own isolated az config dir.
  # example-azure:
  #   provider: azure
  #   tenant_id: your-org.onmicrosoft.com            # Microsoft Entra tenant: id or domain
  #   subscription_id: 00000000-1111-2222-3333-444444444444
  #   region: southeastasia                          # optional: where new resources go
  #   bastion: {name: bas-hub, resource_group: rg-network}   # Azure Bastion for shells and tunnels
  #   clusters:
  #     aks: {name: aks-prod, resource_group: rg-aks}
  #   targets:
  #     jump: {instance: vm-jump, resource_group: rg-app}     # your Entra ID login: no key
  #   tunnels:
  #     pg: {host: 10.20.0.4, port: 5432}            # Bastion connects to the IP itself

  # Huawei Cloud: a KooCLI profile you made (hcloud configure init); mek never writes ~/.hcloud.
  # example-huawei:
  #   provider: huawei
  #   hcloud_profile: default
  #   region: ap-southeast-3                         # optional: --cli-region on each command

# How mek behaves for you (only in this file, not in a project's mek.yaml).
# settings:
#   show_cmd: true     # print each command mek runs as you'd type it yourself (mek show-cmd on|off)
