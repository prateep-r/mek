name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # latest Go, so builds pick up standard-library security fixes
          go-version: stable
      - run: make check # gofmt, vet, unit tests with -race
      - run: make cover # unit + integration coverage, must be 100%
      - run: make vuln

  # The real binary against stub CLIs, and install.sh + a user journey, on
  # both platforms mek ships for: shell tools differ (macOS's sha256sum -c
  # quirk only shows up there).
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install fish (for the shell-init test; bash and zsh are tested where present)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install fish; else sudo apt-get update -qq && sudo apt-get install -y -qq fish zsh; fi
      - run: make test-integration
      - run: make test-e2e

  # Windows: the same code through internal/proc's Windows side (LockFileEx,
  # Job Objects, named events, cmd.exe quoting).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -count=1 -race -coverpkg=./internal/... -coverprofile=cover.out ./...
      - name: Windows-only code is fully covered (the 100% gate elsewhere never compiles it)
        run: go run ./test/testkit/cmd/covercheck -suffix _windows.go cover.out
      - run: go test -tags integration -count=1 ./test/integration/...
      - run: go test -tags e2e -count=1 -run TestInstallPS1 ./test/e2e/
      # gcloud is a .cmd on Windows: the contract tests check mek's cmd.exe quoting with the real one.
      - name: Install the Google Cloud CLI and gke-gcloud-auth-plugin
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-windows-x86_64-bundled-python.zip -OutFile "$env:RUNNER_TEMP\gcloud.zip"
          Expand-Archive "$env:RUNNER_TEMP\gcloud.zip" -DestinationPath $env:RUNNER_TEMP
          & "$env:RUNNER_TEMP\google-cloud-sdk\bin\gcloud.cmd" components install gke-gcloud-auth-plugin --quiet
          "$env:RUNNER_TEMP\google-cloud-sdk\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # The runner's own aws / gcloud / kubectl where installed (a missing one is skipped).
      - run: go test -tags contract -count=1 -v ./test/contract/... 2>&1 | grep -E "^(=== RUN|--- |ok|FAIL|PASS)|_test.go"

  # mek with the real aws / gcloud / kubectl CLIs: offline contract
  # checks, then the full AWS SSO login against the Floci emulator.
  real-clis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: sh test/contract/install-clis.sh
      - run: make test-contract
        env:
          MEK_CONTRACT_REQUIRE: "1" # a missing CLI fails instead of skipping
      - run: make test-emulator
        env:
          MEK_EMULATOR_REQUIRE: "1" # missing docker or CLI fails instead of skipping

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
