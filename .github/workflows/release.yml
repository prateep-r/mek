name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release and upload archives

# GitHub occasionally delivers one tag push twice (v0.4.0 got two runs 3s
# apart). Runs for the same tag wait for each other, and a run that finds the
# tag already released stops instead of failing on duplicate uploads.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if this tag is already released
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
               --jq '.assets[].name' 2>/dev/null | grep -qx checksums.txt; then
            echo "$GITHUB_REF_NAME is already released; nothing to do."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.released.outputs.done != 'true'
        with:
          fetch-depth: 0 # full history for the changelog
      - uses: actions/setup-go@v7
        if: steps.released.outputs.done != 'true'
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        if: steps.released.outputs.done != 'true'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # fine-grained PAT with Contents: read/write on prateep-r/homebrew-tap only
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # mek-desktop for each place it ships, built natively (it needs cgo),
  # added to the release goreleaser made: an unsigned mek.app per Mac
  # architecture, and a Linux build.
  desktop:
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, arch: arm64}
          - {os: macos-latest, arch: amd64}
          - {os: ubuntu-latest, arch: amd64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install GTK and WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev
      - run: sh cmd/mek-desktop/package.sh "$GITHUB_REF_NAME" ${{ matrix.arch }}
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/desktop/* --clobber --repo "$GITHUB_REPOSITORY"

  # The Homebrew cask for mek-desktop, from the Mac files' checksums, in the
  # same tap as mek's (not for pre-releases, like goreleaser's).
  desktop-cask:
    needs: desktop
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write Casks/mek-desktop.rb to prateep-r/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir sums
          GH_TOKEN="$RELEASE_TOKEN" gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir sums --pattern 'mek-desktop_*_darwin_*.zip.sha256'
          sh cmd/mek-desktop/cask.sh "$version" sums > mek-desktop.rb
          path=Casks/mek-desktop.rb
          sha=$(gh api "repos/prateep-r/homebrew-tap/contents/$path" --jq .sha 2>/dev/null) || sha="" # none yet
          gh api -X PUT "repos/prateep-r/homebrew-tap/contents/$path" \
            -f message="mek-desktop $version" -f content="$(base64 -w0 mek-desktop.rb)" ${sha:+-f sha="$sha"} >/dev/null
          echo "Casks/mek-desktop.rb is mek-desktop $version"
